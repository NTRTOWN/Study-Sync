name: Build StudySphere APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build.yml'
      - '**/*.gradle*'
      - '**/build.gradle*'

permissions:
  contents: read

jobs:
  build:
    name: Build Android App
    runs-on: ubuntu-latest

    steps:
      # 1. Download repository files
      - name: Checkout project
        uses: actions/checkout@v4

      # 2. Setup Java JDK
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: 'gradle'

      # 3. Locate Android SDK tools
      - name: Locate Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            for candidate in "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager; do
              if [ -x "$candidate" ]; then
                SDKMANAGER="$candidate"
                break
              fi
            done
          fi

          if [ ! -x "$SDKMANAGER" ]; then
            echo "Android SDK manager not found"
            find "$ANDROID_HOME" -maxdepth 6 -name sdkmanager
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "Found: $SDKMANAGER"

      # 4. Install required Android packages
      - name: Install Android SDK
        shell: bash
        run: |
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            --install \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "platform-tools"

          yes | "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" --licenses || true

      # 5. Automatically Find Project, Generate Key, and Build APK
      - name: Find Project and Build APK
        shell: bash
        run: |
          echo "Searching for gradlew in the repository..."
          GRADLEW_PATH=$(find . -name "gradlew" -type f -print -quit)
          
          if [ -z "$GRADLEW_PATH" ]; then
            echo "Error: gradlew wrapper not found anywhere in the repository!"
            echo "Repository file tree:"
            ls -R
            exit 1
          fi
          
          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          echo "Found Android project at: $PROJECT_DIR"
          
          # Grant execution permission
          chmod +x "$GRADLEW_PATH"
          
          # Create debug signing key inside the project directory
          keytool -genkeypair -v \
            -keystore "$PROJECT_DIR/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 || true

          # Move into project folder and build debug APK
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug --stacktrace

      # 6. Upload APK Artifact (Auto-locates the built APK)
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: studysphere-debug-apk
          path: '**/build/outputs/apk/debug/app-debug.apk'
          if-no-files-found: error
