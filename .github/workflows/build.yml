name: Build Study-Sync APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build.yml'
      - '**/*.gradle*'
      - '**/build.gradle*'

permissions:
  contents: read

jobs:
  build:
    name: Build Android App
    runs-on: ubuntu-latest

    steps:
      # 1. Download repository files
      - name: Checkout project
        uses: actions/checkout@v4

      # 2. Setup Java JDK
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: 'gradle'

      # 3. Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.5'

      # 4. Locate Android SDK tools
      - name: Locate Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            for candidate in "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager; do
              if [ -x "$candidate" ]; then
                SDKMANAGER="$candidate"
                break
              fi
            done
          fi

          if [ ! -x "$SDKMANAGER" ]; then
            echo "Android SDK manager not found"
            find "$ANDROID_HOME" -maxdepth 6 -name sdkmanager
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "Found: $SDKMANAGER"

      # 5. Install required Android packages
      - name: Install Android SDK
        shell: bash
        run: |
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            --install \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "platform-tools"

          yes | "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" --licenses || true

      # 6. Auto-locate Android Project Directory, Generate Wrapper, and Build
      - name: Locate Project and Build APK
        shell: bash
        run: |
          echo "Searching for Android project root (settings.gradle*)..."
          SETTINGS_FILE=$(find . -name "settings.gradle*" -type f -print -quit)
          
          if [ -z "$SETTINGS_FILE" ]; then
            echo "Error: settings.gradle or settings.gradle.kts not found anywhere in the repository!"
            ls -R
            exit 1
          fi
          
          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "Found Android project directory at: $PROJECT_DIR"
          
          # Move directly into the Android project root
          cd "$PROJECT_DIR"
          
          # Generate Gradle wrapper if missing
          if [ ! -f "gradlew" ]; then
            echo "Generating Gradle wrapper..."
            gradle wrapper --gradle-version 8.5
          fi
          
          chmod +x gradlew
          
          # Create debug signing key
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 || true

          # Build debug APK
          ./gradlew assembleDebug --stacktrace

      # 7. Upload APK Artifact
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: studysync-debug-apk
          path: '**/build/outputs/apk/debug/app-debug.apk'
          if-no-files-found: error
