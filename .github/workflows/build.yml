name: Build StudySphere APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build.yml'
      - '**/*.gradle*'
      - '**/build.gradle*'

permissions:
  contents: read

jobs:
  build:
    name: Build Android App
    runs-on: ubuntu-latest

    steps:
      # 1. Download repository files
      - name: Checkout project
        uses: actions/checkout@v4

      # 2. Setup Java JDK
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: 'gradle'

      # 3. Setup Gradle (This installs the gradle command-line tool)
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.5'

      # 4. Locate Android SDK tools
      - name: Locate Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            for candidate in "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager; do
              if [ -x "$candidate" ]; then
                SDKMANAGER="$candidate"
                break
              fi
            done
          fi

          if [ ! -x "$SDKMANAGER" ]; then
            echo "Android SDK manager not found"
            find "$ANDROID_HOME" -maxdepth 6 -name sdkmanager
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "Found: $SDKMANAGER"

      # 5. Install required Android packages
      - name: Install Android SDK
        shell: bash
        run: |
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            --install \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "platform-tools"

          yes | "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" --licenses || true

      # 6. Generate missing gradlew, create keystore, and build APK
      - name: Generate Wrapper and Build APK
        shell: bash
        run: |
          echo "Generating missing Gradle wrapper..."
          gradle wrapper --gradle-version 8.5

          # Grant execution permission to the newly generated gradlew
          chmod +x gradlew
          
          # Create debug signing key
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 || true

          # Build debug APK
          ./gradlew assembleDebug --stacktrace

      # 7. Upload APK Artifact
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: studysphere-debug-apk
          path: 'app/build/outputs/apk/debug/app-debug.apk'
          if-no-files-found: error
