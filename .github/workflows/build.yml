
name: Build StudySphere APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - 
      - name: Setup Android SDK packages
        shell: bash
        run: |
          echo "Android SDK: $ANDROID_HOME"

          SDKMANAGER=$(find "$ANDROID_HOME" \
            -type f -name sdkmanager 2>/dev/null | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager was not found"
            find "$ANDROID_HOME" -maxdepth 5 -type f
            exit 1
          fi

          echo "Found sdkmanager: $SDKMANAGER"

          chmod +x "$SDKMANAGER"

          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --version

          yes | "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" --licenses || true

          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            --install "platforms;android-36-ext1" \
            "build-tools;36.0.0"
